server:
  port: ${PORT:8081}
  shutdown: graceful
  tomcat:
    connection-timeout: 90s 
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

springdoc:
  api-docs:
    path: /api-docs

spring:
  codec:
    max-in-memory-size: 8MB
  lifecycle:
    timeout-per-shutdown-phase: 1m
  # Parse request-body floats as BigDecimal (not double) so small-magnitude certificate values
  # (e.g. 0.0001) survive JsonNode -> XmlMapper rendering in plain decimal notation instead of
  # scientific notation (Double.toString() switches below ~1e-3) — #298. Paired with
  # config.JacksonConfig's node-factory customizer, which stops Jackson from stripping trailing
  # zeros off the resulting BigDecimal (otherwise 250.0 -> 2.5E+2 even with this flag alone).
  jackson:
    deserialization:
      use-big-decimal-for-floats: true
  cache:
    jcache:
      provider: com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
    caffeine:
      spec: maximumSize=1000000,expireAfterAccess=600s
    cache-names:
      - rate-limit-bucket

sentry:
  dsn: ${SENTRY_DSN:}

debug: false

bucket4j:
  enabled: true
  filters:
    - cache-key: getRemoteAddr()
      cache-name: rate-limit-bucket
      url: .*
      http-response-body: "{ \"status\": 429, \"error\": \"Too Many Requests\", \"message\": \"You have exhausted the API usage limits \" }"
      rate-limits:
        - bandwidths:
            - capacity: 20
              time: 60
              unit: seconds

log4j:
  debug: false
